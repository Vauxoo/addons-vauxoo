name: tests

on:
  # Jobs that check out and execute the contributor's code belong here: a fork
  # gets a read-only token and no secrets, so running its code is safe.
  pull_request:
    branches:
      - "*.0"
  # Reserved for jobs that need repository secrets. This context runs with the
  # base repository's token, so any job kept here must NOT execute fork code.
  pull_request_target:
    branches:
      - "*.0"
  push:
    branches:
      - "*.0"

env:
  CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_PROJECT_NAMESPACE: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CI_PROJECT_NAME: ${{ github.event.pull_request.head.repo.name || github.event.repository.name }}

jobs:
  pre-commit-vauxoo:
    runs-on: ubuntu-latest
    name: pre-commit-vauxoo
    # Needs no secret, so it runs in the untrusted context. The guard keeps it
    # from running twice when both PR events fire for the same pull request.
    if: github.event_name != 'pull_request_target'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Cache pre-commit and pip packages
        id: cache-pre-commit-pip
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/pip
          key: cache-pre-commit-pip
      - name: Install pre-commit-vauxoo
        run: pip install --upgrade pre-commit-vauxoo
      - name: Run pre-commit-vauxoo
        run: pre-commit-vauxoo
  no-dependency-files:
    runs-on: ubuntu-latest
    name: No dependency files
    if: github.event_name != 'pull_request_target'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
      - name: Ensure dependency files don't exist
        run: |
          for reqfile in requirements.txt oca_dependencies.txt ; do
              if [ -f ${reqfile} ] ; then
                  echo "Please avoid adding requirement files to this repo, because requirements will be installed in all project depending on this one."
                  echo "If you need them for test to work, you can use test-${reqfile} instead of ${reqfile}"
                  exit 1
                fi
           done
  build_and_test:
    runs-on: ubuntu-latest
    name: Build Docker and test Odoo
    # Kept on pull_request_target because it needs PRIVATE_DEPLOY_KEY to reach
    # private repositories and the registry credentials to push the image.
    # That combination -- secrets plus fork code -- is what actions/checkout
    # refuses for forks; see the note in the pull request that introduced this
    # guard. Skipped on pull_request so it does not run twice on internal PRs.
    if: github.event_name != 'pull_request'
    env:
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CI_COMMIT_SHA }}
          persist-credentials: false
      - name: Cache dependencies
        id: cache-build-depends
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.local/bin/orchestsh
            ~/.local/bin/staticv
          key: cache-build-depends
      - name: Set ssh keys
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.PRIVATE_DEPLOY_KEY }}"
          mkdir -p ~/.ssh/
          ssh-keyscan -H git.vauxoo.com >> ~/.ssh/known_hosts
      - name: Install Python dependencies
        run: pip install -U deployv vxci
      - name: Install apt dependencies
        run: sudo apt update && sudo apt install -y dos2unix
      - name: Install OrchestSH
        env:
          ORCHESTSH_PREFIX: /home/runner/.local/bin
        run: |
          command -v orchestsh || wget -qO- https://raw.githubusercontent.com/Orchestsh/orchestsh/master/installer.sh | sh
          command -v staticv || wget -qO- https://raw.githubusercontent.com/OrchestSh/staticv/master/installer.sh | sh
      - name: Build image
        env:
          PRIVATE_DEPLOY_KEY: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          ORCHEST_REGISTRY: ${{ secrets.ORCHEST_REGISTRY }}
          ORCHEST_TOKEN: ${{ secrets.ORCHEST_TOKEN }}
        run: |
          source variables.sh
          vxci check_keys
          vxci build_image --push_image
      - name: Test odoo image
        run: |
          source variables.sh
          slugified_branch=$(python -c "from vxci.common import slugify; print(slugify('${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}'))")
          source ${slugified_branch}/image_name.env
          vxci test_repo --allow_deprecated
